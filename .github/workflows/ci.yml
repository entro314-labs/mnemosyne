name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs: a tag is mutable and can be repointed
# at new code, a commit SHA cannot. The trailing comment records the human
# version so upgrades stay reviewable.
env:
  UV_VERSION: "0.12.3"
  GITLEAKS_VERSION: "8.30.1"
  # sha256 of gitleaks_8.30.1_linux_x64.tar.gz
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # 3.13 is the supported baseline; 3.14 is exercised so the declared
        # requires-python range is actually tested rather than assumed.
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          # v9 changed the default; state it so cache behaviour is not implicit.
          prune-cache: true

      - name: Pin Python
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --all-groups --python ${{ matrix.python-version }}

      - name: Ruff (lint)
        run: uv run ruff check src tests

      - name: Ruff (format)
        run: uv run ruff format --check src tests

      - name: Mypy
        run: uv run mypy src tests

      - name: Pytest
        run: uv run pytest -q

      - name: Audit locked dependencies
        run: uv audit --locked

      - name: Smoke-test CLI
        run: uv run syne --help

  secrets:
    # A credential-shaped PyPI token was found loose in this repo's working tree;
    # this gate exists so a future one cannot reach history unnoticed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history — a secret in an old commit still counts

      # The open-source gitleaks CLI, not gitleaks/gitleaks-action: the action
      # refuses to run for an organisation without a paid GITLEAKS_LICENSE. The
      # release archive is pinned by version and SHA-256 (from the release's
      # checksums file), so a replaced asset fails the job instead of running.
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" gitleaks

      - name: Scan for secrets
        # Every commit reachable from the checked-out ref, default rules.
        run: |
          "${RUNNER_TEMP}/gitleaks" git --redact --no-banner --exit-code 1 .
