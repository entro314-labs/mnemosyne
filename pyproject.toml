[project]
# Import package and `syne` CLI are "mnemosyne"; the PyPI distribution name is
# "mnemosyne-cc" because the bare "mnemosyne" name is taken by an unrelated project.
name = "mnemosyne-cc"
version = "2.0.0"
description = "Memory + context suite for Claude Code and Codex CLI: clean transcript exports (markdown/JSONL/plain), cross-session merge, cross-tool recall, memory drift checks, plus an MCP server and a Claude Code plugin."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Dominikos Pritis", email = "idominikos@outlook.com" },
]
keywords = [
    "claude",
    "claude-code",
    "anthropic",
    "transcript",
    "export",
    "jsonl",
    "markdown",
    "cli",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Utilities",
]
# Only the libraries actually imported by the package. Transitive deps
# (pydantic-core, starlette, uvicorn, idna, …) resolve automatically — pinning
# them here previously forced an unsatisfiable pydantic-core/pydantic conflict.
dependencies = [
    "cyclopts==5.0.0b1",
    "mcp>=2.0.0",
    "rich>=15.0",
    "tomli-w>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/entro314-labs/mnemosyne"
Repository = "https://github.com/entro314-labs/mnemosyne"
Issues = "https://github.com/entro314-labs/mnemosyne/issues"

[project.scripts]
syne = "mnemosyne.cli:app"

[build-system]
# Floor-pinned so a release build cannot silently resolve an older backend than
# the one this project was validated against.
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mnemosyne"]


[tool.hatch.build.targets.sdist]
include = [
    "src/mnemosyne",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.uv]
# cyclopts 5.x is currently published as a pre-release; allow pre-releases without
# requiring --prerelease=allow on every invocation.
prerelease = "allow"
# Transitive-only security floor. cryptography arrives via mcp → pyjwt; 49.0.0 is
# affected by GHSA-g6cj-pr64-35w5 (PKCS#7 EnvelopedData Bleichenbacher oracle),
# fixed in 50.0.0. mnemosyne never calls the affected API, but the vulnerable
# package must not sit in the resolved graph.
constraint-dependencies = ["cryptography>=50.0.0"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF", "SIM", "TCH", "PTH", "PL"]
ignore = ["PLR0913", "PLR2004"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
